<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BattleOnline Helper — Download & Buy</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #080810; color: #fff; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

  /* ── Language bar ── */
  .lang-bar { display:flex; justify-content:flex-end; gap:8px; padding:10px 20px;
    background:#0d0d20; border-bottom:1px solid #1a1a35; }
  .lang-btn { background:none; border:2px solid transparent; border-radius:8px;
    padding:4px 10px; cursor:pointer; font-size:1.3rem; transition:border-color .15s; }
  .lang-btn:hover { border-color:#f5c446; }
  .lang-btn.active { border-color:#f5c446; }

  /* ── Hero ── */
  .hero { text-align:center; padding:60px 24px 40px;
    background:linear-gradient(180deg,#0d0d28,#080810); }
  .hero h1 { font-size:2.4rem; color:#f5c446; margin-bottom:8px; }
  .hero .version { color:#888; font-size:.9rem; margin-bottom:16px; }
  .hero p { color:#aaa; font-size:1.1rem; max-width:520px; margin:0 auto 32px; }
  .btn-trial { display:inline-block; padding:16px 40px; background:#1a6e2e;
    border:2px solid #27be50; color:#fff; border-radius:12px; font-size:1.1rem;
    font-weight:bold; text-decoration:none; transition:transform .15s; }
  .btn-trial:hover { transform:scale(1.04); }
  .trial-note { color:#666; font-size:.85rem; margin-top:10px; }

  /* ── Plans ── */
  .plans { display:flex; gap:20px; justify-content:center; flex-wrap:wrap;
    padding:48px 24px; max-width:700px; margin:0 auto; }
  .plan { background:#12162a; border:2px solid #3c64c8; border-radius:16px;
    padding:32px 28px; text-align:center; flex:1; min-width:220px; transition:transform .15s; }
  .plan:hover { transform:scale(1.03); border-color:#60a0ff; }
  .plan.popular { border-color:#f5c446; }
  .badge { background:#f5c446; color:#000; font-size:.75rem; font-weight:bold;
    border-radius:20px; padding:3px 12px; display:inline-block; margin-bottom:12px; }
  .plan .price { font-size:2.6rem; color:#f5c446; font-weight:bold; }
  .plan .period { color:#aaa; font-size:1rem; margin:6px 0 20px; }
  .plan ul { list-style:none; text-align:left; margin-bottom:24px; }
  .plan ul li { color:#ccc; font-size:.95rem; padding:4px 0; }
  .plan ul li::before { content:"✓ "; color:#27be50; }
  .btn-buy { display:block; padding:14px; background:#1e3c7a; border:2px solid #3c64c8;
    color:#fff; border-radius:10px; font-size:1rem; font-weight:bold; cursor:pointer;
    text-decoration:none; transition:background .15s; }
  .btn-buy:hover { background:#254d9e; }
  .plan.popular .btn-buy { background:#7a5a00; border-color:#f5c446; }
