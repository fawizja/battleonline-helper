<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BattleOnline Helper — Download & Buy</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #080810; color: #fff; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

  /* ── Language bar ── */
  .lang-bar { display:flex; justify-content:flex-end; gap:8px; padding:10px 20px;
    background:#0d0d20; border-bottom:1px solid #1a1a35; }
  .lang-btn { background:none; border:2px solid transparent; border-radius:8px;
    padding:4px 10px; cursor:pointer; font-size:1.3rem; transition:border-color .15s; }
  .lang-btn:hover { border-color:#f5c446; }
  .lang-btn.active { border-color:#f5c446; }

  /* ── Hero ── */
  .hero { text-align:center; padding:60px 24px 40px;
    background:linear-gradient(180deg,#0d0d28,#080810); }
  .hero h1 { font-size:2.4rem; color:#f5c446; margin-bottom:8px; }
  .hero .version { color:#888; font-size:.9rem; margin-bottom:16px; }
  .hero p { color:#aaa; font-size:1.1rem; max-width:520px; margin:0 auto 32px; }
  .btn-trial { display:inline-block; padding:16px 40px; background:#1a6e2e;
    border:2px solid #27be50; color:#fff; border-radius:12px; font-size:1.1rem;
    font-weight:bold; text-decoration:none; transition:transform .15s; }
  .btn-trial:hover { transform:scale(1.04); }
  .trial-note { color:#666; font-size:.85rem; margin-top:10px; }

  /* ── Plans ── */
  .plans { display:flex; gap:20px; justify-content:center; flex-wrap:wrap;
    padding:48px 24px; max-width:700px; margin:0 auto; }
  .plan { background:#12162a; border:2px solid #3c64c8; border-radius:16px;
    padding:32px 28px; text-align:center; flex:1; min-width:220px; transition:transform .15s; }
  .plan:hover { transform:scale(1.03); border-color:#60a0ff; }
  .plan.popular { border-color:#f5c446; }
  .badge { background:#f5c446; color:#000; font-size:.75rem; font-weight:bold;
    border-radius:20px; padding:3px 12px; display:inline-block; margin-bottom:12px; }
  .plan .price { font-size:2.6rem; color:#f5c446; font-weight:bold; }
  .plan .period { color:#aaa; font-size:1rem; margin:6px 0 20px; }
  .plan ul { list-style:none; text-align:left; margin-bottom:24px; }
  .plan ul li { color:#ccc; font-size:.95rem; padding:4px 0; }
  .plan ul li::before { content:"✓ "; color:#27be50; }
  .btn-buy { display:block; padding:14px; background:#1e3c7a; border:2px solid #3c64c8;
    color:#fff; border-radius:10px; font-size:1rem; font-weight:bold; cursor:pointer;
    text-decoration:none; transition:background .15s; }
  .btn-buy:hover { background:#254d9e; }
  .plan.popular .btn-buy { background:#7a5a00; border-color:#f5c446; }
  .plan.popular .btn-buy:hover { background:#9e7800; }

  /* ── How to ── */
  .how { max-width:600px; margin:0 auto; padding:0 24px 60px; }
  .how h2 { color:#f5c446; font-size:1.4rem; margin-bottom:20px; text-align:center; }
  .step { display:flex; gap:16px; align-items:flex-start; margin-bottom:18px; }
  .step .num { background:#1e3c7a; color:#60a0ff; border-radius:50%; width:32px; height:32px;
    display:flex; align-items:center; justify-content:center; font-weight:bold; flex-shrink:0; }
  .step p { color:#ccc; font-size:.95rem; padding-top:4px; }

  footer { text-align:center; padding:24px; color:#444; font-size:.85rem;
    border-top:1px solid #1a1a2e; }

  /* ── Modal ── */
  .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:100;
    align-items:center; justify-content:center; }
  .modal-bg.open { display:flex; }
  .modal { background:#12162a; border:2px solid #3c64c8; border-radius:16px;
    padding:32px; max-width:440px; width:90%; }
  .modal h3 { color:#f5c446; font-size:1.3rem; margin-bottom:16px; }
  .modal label { color:#aaa; font-size:.9rem; display:block; margin-bottom:6px; }
  .modal input { width:100%; padding:12px; background:#0d0d28; border:2px solid #3c64c8;
    border-radius:8px; color:#fff; font-size:1rem; font-family:monospace;
    margin-bottom:20px; text-transform:uppercase; letter-spacing:2px; }
  .modal input:focus { outline:none; border-color:#60a0ff; }
  .modal .price-label { color:#f5c446; font-size:1.5rem; font-weight:bold; margin-bottom:20px; }
  .modal-btns { display:flex; gap:12px; }
  .modal-btns .cancel { flex:1; padding:12px; background:#1a1a2e; border:1px solid #444;
    color:#aaa; border-radius:8px; cursor:pointer; }
  .modal-btns .pay { flex:2; padding:12px; background:#1e3c7a; border:2px solid #3c64c8;
    color:#fff; border-radius:8px; cursor:pointer; font-weight:bold; font-size:1rem; }
  .modal-btns .pay:hover { background:#254d9e; }
</style>
</head>
<body>

<!-- ── Language bar ── -->
<div class="lang-bar">

  <button class="lang-btn" onclick="setLang('pl')" id="btn-pl" title="Polski">🇵🇱</button>
  <button class="lang-btn" onclick="setLang('br')" id="btn-br" title="Português">🇧🇷</button>
</div>

<!-- ── Hero ── -->
<div class="hero">

  <div class="version">v1.0.1</div>
  <p data-i18n="hero_desc"></p>
  <a href="https://github.com/fawizja/battleonline-helper/releases/download/v1.0.1/app-debug.apk" class="btn-trial" download data-i18n="btn_download"></a>

</div>

<!-- ── Plans ── -->
<section class="plans">
  <div class="plan">
    <div class="price">$2.50</div>
    <div class="period" data-i18n="days10"></div>
    <ul>
      <li data-i18n="feat1"></li>
      <li data-i18n="feat2"></li>
      <li data-i18n="feat3"></li>
      <li data-i18n="feat4"></li>
    </ul>
    <a class="btn-buy" onclick="openModal('10days','10days_label','$2.50')" data-i18n="buy10"></a>
  </div>
  <div class="plan popular">
    <div class="badge" data-i18n="popular"></div>
    <div class="price">$6.50</div>
    <div class="period" data-i18n="days30"></div>
    <ul>
      <li data-i18n="feat1"></li>
      <li data-i18n="feat2"></li>
      <li data-i18n="feat3"></li>
      <li data-i18n="feat4"></li>
    </ul>
    <a class="btn-buy" onclick="openModal('30days','30days_label','$6.50')" data-i18n="buy30"></a>
  </div>
</section>

<!-- ── How to ── -->
<section class="how">
  <h2 data-i18n="how_title"></h2>
  <div class="step"><div class="num">1</div><p data-i18n="step1"></p></div>
  <div class="step"><div class="num">2</div><p data-i18n="step2"></p></div>
  <div class="step"><div class="num">3</div><p data-i18n="step3"></p></div>
  <div class="step"><div class="num">4</div><p data-i18n="step4"></p></div>
</section>

<footer>© 2026 BattleOnline Helper &nbsp;|&nbsp; battleonline.helper@gmail.com</footer>

<!-- ── Modal ── -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 data-i18n="modal_title"></h3>
    <div class="price-label" id="modalPrice"></div>
    <label data-i18n="modal_label"></label>
    <input type="text" id="deviceInput" maxlength="20">
    <div class="modal-btns">
      <button class="cancel" onclick="closeModal()" data-i18n="modal_cancel"></button>
      <button class="pay" onclick="goToCheckout()" data-i18n="modal_pay"></button>
    </div>
  </div>
</div>

<script>
const T = {
  en: {
    hero_desc:    "Automatic fishing & combat bot for BattleOnline. Works on Android devices.",
    btn_download: "⬇ Download Trial (3 hours free)",
    trial_note:   "No registration required. Trial activates automatically on first launch.",
    days10:       "10 days",
    days30:       "30 days",
    days10_label: "10 days",
    days30_label: "30 days",
    feat1:        "All features",
    feat2:        "Fishing (Caelbourne)",
    feat3:        "EXP Normal & Fast Hunt",
    feat4:        "Technical support",
    popular:      "⭐ MOST POPULAR",
    buy10:        "Buy 10 days",
    buy30:        "Buy 30 days",
    how_title:    "How to buy?",
    step1:        "Open BattleOnline Helper on your phone and wait for the trial to expire — your <strong>device code</strong> will appear.",
    step2:        "Click <strong>Buy</strong> above and enter the device code from the app.",
    step3:        "Pay via <strong>Stripe</strong> (credit card or Google Pay).",
    step4:        "Your license activates <strong>automatically</strong> — relaunch the app.",
    modal_title:  "🔑 License Activation",
    modal_label:  "Device code from the app:",
    modal_cancel: "Cancel",
    modal_pay:    "Go to payment →",
    modal_alert:  "Please enter a valid device code.",
  },
  pl: {
    hero_desc:    "Automatyczny bot do łowienia i walki w BattleOnline. Działa na urządzeniach Android.",
    btn_download: "⬇ Pobierz Trial (3 godziny za darmo)",
    trial_note:   "Bez rejestracji. Trial aktywuje się automatycznie przy pierwszym uruchomieniu.",
    days10:       "10 dni",
    days30:       "30 dni",
    days10_label: "10 dni",
    days30_label: "30 dni",
    feat1:        "Wszystkie funkcje",
    feat2:        "Łowienie (Caelbourne)",
    feat3:        "EXP Normal & Fast Hunt",
    feat4:        "Wsparcie techniczne",
    popular:      "⭐ NAJPOPULARNIEJSZY",
    buy10:        "Kup 10 dni",
    buy30:        "Kup 30 dni",
    how_title:    "Jak kupić?",
    step1:        "Otwórz BattleOnline Helper na telefonie i poczekaj aż trial wygaśnie — pojawi się <strong>kod urządzenia</strong>.",
    step2:        "Kliknij <strong>Kup</strong> powyżej i wpisz kod urządzenia z aplikacji.",
    step3:        "Zapłać przez <strong>Stripe</strong> (karta kredytowa lub Google Pay).",
    step4:        "Licencja aktywuje się <strong>automatycznie</strong> — uruchom aplikację ponownie.",
    modal_title:  "🔑 Aktywacja licencji",
    modal_label:  "Kod urządzenia z aplikacji:",
    modal_cancel: "Anuluj",
    modal_pay:    "Przejdź do płatności →",
    modal_alert:  "Wpisz prawidłowy kod urządzenia.",
  },
  br: {
    hero_desc:    "Bot automático de pesca e combate para BattleOnline. Funciona em dispositivos Android.",
    btn_download: "⬇ Baixar Trial (3 horas grátis)",
    trial_note:   "Sem registro. O trial ativa automaticamente no primeiro lançamento.",
    days10:       "10 dias",
    days30:       "30 dias",
    days10_label: "10 dias",
    days30_label: "30 dias",
    feat1:        "Todas as funções",
    feat2:        "Pesca (Caelbourne)",
    feat3:        "EXP Normal & Fast Hunt",
    feat4:        "Suporte técnico",
    popular:      "⭐ MAIS POPULAR",
    buy10:        "Comprar 10 dias",
    buy30:        "Comprar 30 dias",
    how_title:    "Como comprar?",
    step1:        "Abra o BattleOnline Helper no celular e espere o trial expirar — seu <strong>código do dispositivo</strong> aparecerá.",
    step2:        "Clique em <strong>Comprar</strong> acima e insira o código do dispositivo do app.",
    step3:        "Pague via <strong>Stripe</strong> (cartão de crédito ou Google Pay).",
    step4:        "A licença ativa <strong>automaticamente</strong> — reinicie o aplicativo.",
    modal_title:  "🔑 Ativação de licença",
    modal_label:  "Código do dispositivo do app:",
    modal_cancel: "Cancelar",
    modal_pay:    "Ir para pagamento →",
    modal_alert:  "Insira um código de dispositivo válido.",
  }
};

let lang = localStorage.getItem('lang') || 'en';
let currentPlan = '';
let currentLabelKey = '';

function setLang(l) {
  lang = l;
  localStorage.setItem('lang', l);
  applyLang();
}

function applyLang() {
  const t = T[lang];
  // Update all data-i18n elements
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) el.innerHTML = t[key];
  });
  // Update input placeholder
  document.getElementById('deviceInput').placeholder =
    lang === 'pl' ? 'np. A1B2C3D4' : lang === 'br' ? 'ex. A1B2C3D4' : 'e.g. A1B2C3D4';
  // Update active flag button
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + lang)?.classList.add('active');
  // Update html lang
  document.documentElement.lang = lang === 'br' ? 'pt-BR' : lang;
}

function openModal(plan, labelKey, price) {
  currentPlan = plan;
  currentLabelKey = labelKey;
  document.getElementById('modalPrice').textContent = price + ' / ' + T[lang][labelKey];
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('deviceInput').value = '';
  document.getElementById('deviceInput').focus();
}

function closeModal() {
  document.getElementById('modalBg').classList.remove('open');
}

function goToCheckout() {
  const id = document.getElementById('deviceInput').value.trim().toUpperCase();
  if (id.length < 8) { alert(T[lang].modal_alert); return; }
  const links = {
    '10days': 'https://buy.stripe.com/8x28wH6416e5b4350VfUQ01?client_reference_id=' + id,
    '30days': 'https://buy.stripe.com/3cI3cn785bypc878d7fUQ00?client_reference_id=' + id
  };
  window.location.href = links[currentPlan];
}

document.getElementById('modalBg').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Init
applyLang();
</script>
</body>
</html>
