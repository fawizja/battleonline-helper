<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #080c14;
    --surface:  #0f1320;
    --border:   #1e2540;
    --gold:     #f5c446;
    --gold2:    #e0a800;
    --green:    #1a6e2e;
    --green2:   #27a245;
    --text:     #e8eaf0;
    --muted:    #7a8099;
    --radius:   14px;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ── NAV ── */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(8,12,20,.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; gap: 12px;
  }
  .nav-logo { font-size: 1.1rem; font-weight: 700; color: var(--gold); letter-spacing: -.02em; }
  .lang-bar { display: flex; gap: 6px; }
  .lang-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 5px 10px; font-size: .8rem; cursor: pointer;
    transition: all .2s;
  }
  .lang-btn.active, .lang-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* ── HERO ── */
  .hero {
    text-align: center;
    padding: 80px 24px 60px;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, #1a2a0a22, transparent);
  }
  .hero-badge {
    display: inline-block; background: var(--border);
    border: 1px solid var(--gold);
    color: var(--gold); font-size: .75rem; font-weight: 600;
    padding: 4px 14px; border-radius: 99px; margin-bottom: 20px;
    letter-spacing: .08em; text-transform: uppercase;
  }
  .hero h1 {
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 900; color: #fff;
    letter-spacing: -.04em; margin-bottom: 12px;
  }
  .hero h1 span { color: var(--gold); }
  .hero .version { color: var(--muted); font-size: .85rem; margin-bottom: 16px; }
  .hero .hero-note { color: var(--muted); font-size: .78rem; margin-top: 14px; max-width: 520px; margin-left: auto; margin-right: auto; }
  .hero p { color: #aab0c8; font-size: 1.05rem; max-width: 500px; margin: 0 auto 36px; }

  .btn-download {
    display: inline-flex; align-items: center; gap: 10px;
    background: linear-gradient(135deg, var(--green), var(--green2));
    color: #fff; font-size: 1rem; font-weight: 700;
    padding: 16px 36px; border-radius: var(--radius);
    text-decoration: none; transition: transform .2s, box-shadow .2s;
    box-shadow: 0 4px 24px #27a24540;
  }
  .btn-download:hover { transform: translateY(-2px); box-shadow: 0 8px 32px #27a24560; }

  /* ── FEATURES ── */
  .features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    max-width: 900px; margin: 0 auto;
    padding: 0 24px 70px;
  }
  .feat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    display: flex; align-items: center; gap: 14px;
    transition: border-color .2s;
  }
  .feat-card:hover { border-color: var(--gold); }
  .feat-icon { font-size: 1.8rem; flex-shrink: 0; }
  .feat-card strong { display: block; color: #fff; font-size: .95rem; margin-bottom: 2px; }
  .feat-card span { color: var(--muted); font-size: .8rem; }

  /* ── PRICING ── */
  .pricing-section { padding: 0 24px 70px; }
  .section-title {
    text-align: center; font-size: 1.5rem; font-weight: 700;
    color: var(--gold); margin-bottom: 8px;
  }
  .section-sub { text-align: center; color: var(--muted); font-size: .9rem; margin-bottom: 36px; }

  .plans {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px; max-width: 600px; margin: 0 auto;
  }
  .plan {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
    text-align: center;
    position: relative;
    transition: border-color .2s, transform .2s;
  }
  .plan:hover { border-color: #444; transform: translateY(-2px); }
  .plan.popular {
    border-color: var(--gold);
    background: linear-gradient(160deg, #1a1500, var(--surface));
  }
  .badge {
    position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
    background: var(--gold); color: #000; font-size: .7rem; font-weight: 800;
    padding: 3px 14px; border-radius: 99px; white-space: nowrap;
  }
  .plan .price { font-size: 2.4rem; font-weight: 900; color: #fff; }
  .plan .period { color: var(--muted); font-size: .85rem; margin-bottom: 20px; }
  .plan-feats { list-style: none; margin-bottom: 24px; }
  .plan-feats li {
    color: #b0b8cc; font-size: .85rem; padding: 5px 0;
    border-bottom: 1px solid var(--border);
  }
  .plan-feats li:last-child { border: none; }
  .plan-feats li::before { content: "✓  "; color: var(--green2); font-weight: 700; }
  .btn-buy {
    display: block; width: 100%;
    background: var(--border); color: #fff;
    border: 1px solid #2e3555; border-radius: 10px;
    padding: 12px; font-size: .9rem; font-weight: 700;
    cursor: pointer; transition: background .2s;
  }
  .plan.popular .btn-buy {
    background: var(--gold); color: #000; border-color: var(--gold2);
  }
  .btn-buy:hover { opacity: .85; }

  /* ── HOW TO BUY ── */
  .how-section { padding: 0 24px 70px; }
  .steps {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px; max-width: 900px; margin: 0 auto;
  }
  .step {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    display: flex; gap: 14px;
  }
  .step-num {
    width: 32px; height: 32px; flex-shrink: 0;
    background: var(--gold); color: #000;
    font-weight: 900; font-size: .9rem;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  .step p { color: #b0b8cc; font-size: .85rem; }

  /* ── SCREENSHOTS ── */
  .screenshots-section { padding: 0 24px 70px; }
  .screenshots {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px; max-width: 900px; margin: 0 auto;
  }
  .screenshots figure {
    margin: 0; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--border); background: var(--surface);
    transition: transform .2s, border-color .2s;
  }
  .screenshots figure:hover { transform: scale(1.03); border-color: #444; }
  .screenshots img { width: 100%; display: block; aspect-ratio: 9/16; object-fit: cover; }
  .screenshots figcaption { text-align: center; font-size: .7rem; color: var(--muted); padding: 6px 4px; }

  /* ── CHANGELOG ── */
  .changelog-section { padding: 0 24px 70px; }
  .cl-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px; max-width: 900px; margin: 0 auto;
  }
  .cl-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
    display: flex; gap: 14px; align-items: flex-start;
  }
  .cl-icon { font-size: 1.6rem; flex-shrink: 0; margin-top: 2px; }
  .cl-item strong { display: block; color: #fff; font-size: .9rem; margin-bottom: 4px; }
  .cl-item p { color: var(--muted); font-size: .8rem; line-height: 1.5; }
  .cl-version { text-align: center; color: var(--muted); font-size: .8rem; margin-bottom: 24px; letter-spacing: .08em; }

  /* ── FOOTER ── */
  footer {
    text-align: center; padding: 28px 24px;
    color: var(--muted); font-size: .8rem;
    border-top: 1px solid var(--border);
  }

  /* ── MODAL ── */
  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.7); backdrop-filter: blur(6px);
    z-index: 999; align-items: center; justify-content: center;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 32px 28px;
    width: min(90vw, 380px);
  }
  .modal h3 { color: var(--gold); font-size: 1.2rem; margin-bottom: 8px; }
  .price-label { color: #fff; font-size: 1rem; font-weight: 700; margin-bottom: 18px; }
  .modal label { display: block; color: var(--muted); font-size: .85rem; margin-bottom: 8px; }
  .modal input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; color: #fff; padding: 12px 14px; font-size: 1rem;
    margin-bottom: 20px; outline: none;
  }
  .modal input:focus { border-color: var(--gold); }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button {
    flex: 1; padding: 12px; border-radius: 10px;
    font-size: .9rem; font-weight: 700; cursor: pointer; border: none;
    transition: opacity .2s;
  }
  .modal-btns button:hover { opacity: .85; }
  .modal-btns .cancel { background: var(--border); color: var(--muted); }
  .modal-btns .pay { background: var(--gold); color: #000; }

  @media (max-width: 480px) {
    .hero h1 { font-size: 1.9rem; }
    .plans { grid-template-columns: 1fr; }
  }
</style>
</head>

let lang = localStorage.getItem('lang') || 'en';
let currentPlan = '', currentLabelKey = '';

function setLang(l) { lang = l; localStorage.setItem('lang', l); applyLang(); }

function applyLang() {
  const t = T[lang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) el.innerHTML = t[key];
  });
  document.getElementById('deviceInput').placeholder =
    lang === 'pl' ? 'np. A1B2C3D4' : lang === 'br' ? 'ex. A1B2C3D4' : 'e.g. A1B2C3D4';
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + lang)?.classList.add('active');
  document.documentElement.lang = lang === 'br' ? 'pt-BR' : lang;
}

function openModal(plan, labelKey, price) {
  currentPlan = plan; currentLabelKey = labelKey;
  document.getElementById('modalPrice').textContent = price + ' / ' + T[lang][labelKey];
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('deviceInput').value = '';
  document.getElementById('deviceInput').focus();
}
function closeModal() { document.getElementById('modalBg').classList.remove('open'); }
function goToCheckout() {
  const id = document.getElementById('deviceInput').value.trim().toUpperCase();
  if (id.length < 8) { alert(T[lang].modal_alert); return; }
  const links = {
    '10days': 'https://buy.stripe.com/8x28wH6416e5b4350VfUQ01?client_reference_id=' + id,
    '30days': 'https://buy.stripe.com/3cI3cn785bypc878d7fUQ00?client_reference_id=' + id
  };
  window.location.href = links[currentPlan];
}
document.getElementById('modalBg').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
applyLang();
</script>
